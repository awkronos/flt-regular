on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout project
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
        with:
          fetch-depth: 0

      # CISEC-ELAN-1026 (security): the previous `curl … | sh` from the elan
      # repo's mutable master ran under the default run shell (bash -e, no
      # pipefail), so a failed fetch still reported green. Install from a
      # pinned leanprover/elan release asset instead: release assets are
      # immutable, the SHA256 is verified before extraction, and
      # `set -euo pipefail` makes any fetch/verify failure fail this step.
      # Bump ELAN_VERSION and the per-asset SHA256s together when upgrading.
      - name: Install elan
        run: |
          set -euo pipefail
          ELAN_VERSION=v4.2.4
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64)  ASSET=elan-aarch64-apple-darwin.tar.gz;      SHA256=7ad829861392c718dfebde3a83b5c8508df47be02af68894b094b0b3952616e5 ;;
            Darwin-x86_64) ASSET=elan-x86_64-apple-darwin.tar.gz;       SHA256=8a340b309d8ed2e96f930761fa223b3af57a38f5d253b53ac90293c9516f8cd4 ;;
            Linux-x86_64)  ASSET=elan-x86_64-unknown-linux-gnu.tar.gz;  SHA256=42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63 ;;
            Linux-aarch64) ASSET=elan-aarch64-unknown-linux-gnu.tar.gz; SHA256=05febd124d84ebf994b2e7479922a5650b1e950c17ae3bd1ddd776b65bb72bf9 ;;
            *) echo "::error::CISEC-ELAN-1026: unsupported platform $(uname -s)-$(uname -m) for pinned elan install"; exit 1 ;;
          esac
          workdir="$(mktemp -d)"
          curl -fsSL -o "$workdir/$ASSET" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/${ASSET}"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${SHA256}  ${workdir}/${ASSET}" | sha256sum -c -
          else
            echo "${SHA256}  ${workdir}/${ASSET}" | shasum -a 256 -c -
          fi
          tar -xzf "$workdir/$ASSET" -C "$workdir"
          "$workdir/elan-init" -y --default-toolchain none

      - name: Assert elan
        run: ~/.elan/bin/elan --version

      - name: Get cache
        run: ~/.elan/bin/lake exe cache get || true

      - name: Build project
        run: ~/.elan/bin/lake -R -Kenv=dev build FltRegular
